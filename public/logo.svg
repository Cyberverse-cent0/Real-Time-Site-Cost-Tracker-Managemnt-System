<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#logoGradient)" opacity="0.1"/>
  
  <!-- Building silhouette -->
  <rect x="156" y="120" width="200" height="280" rx="8" fill="url(#logoGradient)" opacity="0.9"/>
  
  <!-- Windows grid -->
  <g fill="#ffffff" opacity="0.8">
    <rect x="176" y="140" width="40" height="40" rx="4"/>
    <rect x="236" y="140" width="40" height="40" rx="4"/>
    <rect x="296" y="140" width="40" height="40" rx="4"/>
    
    <rect x="176" y="200" width="40" height="40" rx="4"/>
    <rect x="236" y="200" width="40" height="40" rx="4"/>
    <rect x="296" y="200" width="40" height="40" rx="4"/>
    
    <rect x="176" y="260" width="40" height="40" rx="4"/>
    <rect x="236" y="260" width="40" height="40" rx="4"/>
    <rect x="296" y="260" width="40" height="40" rx="4"/>
    
    <rect x="176" y="320" width="40" height="40" rx="4"/>
    <rect x="236" y="320" width="40" height="40" rx="4"/>
    <rect x="296" y="320" width="40" height="40" rx="4"/>
  </g>
  
  <!-- Dollar sign/currency symbol -->
  <circle cx="356" cy="156" r="60" fill="#22c55e"/>
  <text x="356" y="175" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>
  
  <!-- Chart/graph line -->
  <polyline points="116,360 156,320 196,340 236,280 276,300 316,240 356,260" 
            fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Data points -->
  <g fill="#f59e0b">
    <circle cx="156" cy="320" r="8"/>
    <circle cx="196" cy="340" r="8"/>
    <circle cx="236" cy="280" r="8"/>
    <circle cx="276" cy="300" r="8"/>
    <circle cx="316" cy="240" r="8"/>
    <circle cx="356" cy="260" r="8"/>
  </g>
</svg>
