<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgGradient)"/>
  
  <!-- Building icon -->
  <g fill="#ffffff">
    <!-- Main building body -->
    <rect x="68" y="56" width="88" height="144" rx="8"/>
    
    <!-- Windows -->
    <rect x="80" y="72" width="20" height="20" rx="4" fill="#0ea5e9" opacity="0.6"/>
    <rect x="112" y="72" width="20" height="20" rx="4" fill="#0ea5e9" opacity="0.6"/>
    
    <rect x="80" y="104" width="20" height="20" rx="4" fill="#0ea5e9" opacity="0.6"/>
    <rect x="112" y="104" width="20" height="20" rx="4" fill="#0ea5e9" opacity="0.6"/>
    
    <rect x="80" y="136" width="20" height="20" rx="4" fill="#0ea5e9" opacity="0.6"/>
    <rect x="112" y="136" width="20" height="20" rx="4" fill="#0ea5e9" opacity="0.6"/>
    
    <rect x="80" y="168" width="20" height="20" rx="4" fill="#0ea5e9" opacity="0.6"/>
    <rect x="112" y="168" width="20" height="20" rx="4" fill="#0ea5e9" opacity="0.6"/>
  </g>
  
  <!-- Currency/Chart badge -->
  <circle cx="180" cy="180" r="36" fill="#22c55e"/>
  <text x="180" y="192" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>
</svg>
